name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    outputs:
      required-work: ${{ steps.changes.outputs.required-work }}
      version: ${{ steps.changes.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan required work
        id: changes
        uses: loadingalias/cargo-rail-action@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1

      - name: Upload Linux plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-rail-plan-linux
          path: ${{ steps.changes.outputs.plan-file }}
          if-no-files-found: error

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [detect]
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      (contains(fromJSON(needs.detect.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.detect.outputs.required-work), 'cargo.clippy') ||
      contains(fromJSON(needs.detect.outputs.required-work), 'cargo.fmt') ||
      contains(fromJSON(needs.detect.outputs.required-work), 'ci'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Download Linux plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-rail-plan-linux
          path: ${{ runner.temp }}/cargo-rail-plan

      - name: Install Cargo-Rail plan consumer
        uses: loadingalias/cargo-rail-action/setup@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1
        with:
          version: ${{ needs.detect.outputs.version }}

      - name: Run tests for affected crates
        if: contains(fromJSON(needs.detect.outputs.required-work), 'cargo.test')
        shell: bash
        env:
          PLAN_FILE: ${{ runner.temp }}/cargo-rail-plan/plan.json
        run: |
          ARGS_FILE="$(mktemp "$RUNNER_TEMP/cargo-rail-args.XXXXXX")"
          cargo-rail-action plan cargo-args "$PLAN_FILE" cargo.test > "$ARGS_FILE" || exit "$?"
          CARGO_ARGS=()
          while IFS= read -r -d '' argument; do CARGO_ARGS+=("$argument"); done < "$ARGS_FILE"
          rm -- "$ARGS_FILE"
          cargo test "${CARGO_ARGS[@]}" --verbose

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    needs: [detect]
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      (contains(fromJSON(needs.detect.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.detect.outputs.required-work), 'ci'))
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Check compilation
        run: cargo check --workspace --exclude xtask --verbose

  unused-deps:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest
    needs: [detect]
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      (contains(fromJSON(needs.detect.outputs.required-work), 'dependency-policy') ||
      contains(fromJSON(needs.detect.outputs.required-work), 'ci'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-rail
        uses: loadingalias/cargo-rail-action/setup@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1

      - name: Check for unused dependencies
        run: cargo rail unify --check

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [detect]
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      (contains(fromJSON(needs.detect.outputs.required-work), 'dependency-policy') ||
      contains(fromJSON(needs.detect.outputs.required-work), 'ci'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    name: Check Typos
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for typos
        uses: crate-ci/typos@master
